<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Crew</title>
  <meta name="description" content="Connect Crew(コネクトクルー)の導入ガイド・サポート・プライバシーポリシー。">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f2ea; --panel: #fdfcf8; --line: #ddd5c2;
      --ink: #23222b; --muted: #7a7566; --gold: #a8842e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0f15; --panel: #16171f; --line: #2b2d3c;
        --ink: #efedf3; --muted: #97949f; --gold: #d9b45b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.8;
      font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
    main { width: min(680px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0 80px; }
    .eyebrow { letter-spacing: .3em; font-size: 11px; color: var(--gold);
      text-transform: uppercase; font-family: "Hiragino Mincho ProN", serif; }
    h1 { margin: 10px 0 8px; font-size: clamp(32px, 7vw, 46px); line-height: 1.2; }
    .lead { color: var(--muted); max-width: 34em; }
    .links { display: grid; gap: 14px; margin-top: 34px; }
    .card { display: block; padding: 20px 24px; border: 1px solid var(--line);
      border-radius: 16px; background: var(--panel); color: inherit; text-decoration: none; }
    .card strong { display: block; font-size: 20px; margin-bottom: 4px; }
    .card span { color: var(--muted); font-size: 14px; }
    .card:hover strong { color: var(--gold); }
    footer { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 13px; }
    footer a { color: var(--gold); }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Connect Crew</div>
    <h1>コネクトクルー</h1>
    <p class="lead">店舗チームの初回・顧客共有アプリ。導入の手順、サポート、プライバシーポリシーはこちらから。</p>

    <div class="links">
      <a class="card" href="./guide.html">
        <strong>導入ガイド</strong>
        <span>アプリの入れ方・招待コードでの参加・承認・初回ナビ連携まで、順番どおりの説明。</span>
      </a>
      <a class="card" href="./support.html">
        <strong>サポート</strong>
        <span>お問い合わせとよくある質問。</span>
      </a>
      <a class="card" href="./privacy.html">
        <strong>プライバシーポリシー</strong>
        <span>収集する情報と取り扱いについて。</span>
      </a>
    </div>

    <footer>
      <p>© 2026 ARSDAVINCI ・ <a href="../">ARSDAVINCI Apps</a></p>
    </footer>
  </main>
</body>
</html>
